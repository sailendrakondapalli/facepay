<!DOCTYPE html>
<html>
<head>
    <title>WebAuthn Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 10px 0; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; }
        .error { background: #ffebee; }
        .success { background: #e8f5e9; }
    </style>
</head>
<body>
    <h1>WebAuthn Debug Test</h1>
    
    <button onclick="testSupport()">1. Check WebAuthn Support</button>
    <div id="support-result" class="result"></div>
    
    <button onclick="testAuthenticator()">2. Check Platform Authenticator</button>
    <div id="authenticator-result" class="result"></div>
    
    <button onclick="testSimpleRegistration()">3. Test Simple Registration</button>
    <div id="registration-result" class="result"></div>
    
    <button onclick="testSupabaseConnection()">4. Test Supabase Connection</button>
    <div id="supabase-result" class="result"></div>
    
    <script>
        function log(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<pre>${message}</pre>`;
            element.className = 'result ' + (isError ? 'error' : 'success');
        }
        
        function testSupport() {
            try {
                const supported = window.PublicKeyCredential !== undefined &&
                                 typeof window.PublicKeyCredential === 'function';
                log('support-result', `WebAuthn Support: ${supported ? '✅ YES' : '❌ NO'}`);
            } catch (error) {
                log('support-result', `Error: ${error.message}`, true);
            }
        }
        
        async function testAuthenticator() {
            try {
                if (!window.PublicKeyCredential) {
                    log('authenticator-result', '❌ WebAuthn not supported', true);
                    return;
                }
                
                const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                log('authenticator-result', `Platform Authenticator: ${available ? '✅ Available' : '❌ Not Available'}`);
            } catch (error) {
                log('authenticator-result', `Error: ${error.message}`, true);
            }
        }
        
        async function testSimpleRegistration() {
            try {
                const challengeBytes = crypto.getRandomValues(new Uint8Array(32));
                const challenge = btoa(String.fromCharCode(...challengeBytes));
                const userIdBytes = crypto.getRandomValues(new Uint8Array(32));
                const userId = btoa(String.fromCharCode(...userIdBytes));
                
                const options = {
                    challenge: Uint8Array.from(atob(challenge), c => c.charCodeAt(0)),
                    rp: {
                        name: "FacePay Test",
                        id: window.location.hostname
                    },
                    user: {
                        id: Uint8Array.from(atob(userId), c => c.charCodeAt(0)),
                        name: "test@example.com",
                        displayName: "Test User"
                    },
                    pubKeyCredParams: [
                        { alg: -7, type: "public-key" },
                        { alg: -257, type: "public-key" }
                    ],
                    authenticatorSelection: {
                        authenticatorAttachment: "platform",
                        userVerification: "required"
                    },
                    timeout: 300000,
                    attestation: "none"
                };
                
                log('registration-result', '🔄 Starting WebAuthn registration...');
                
                const credential = await navigator.credentials.create({
                    publicKey: options
                });
                
                log('registration-result', `✅ Registration successful!\nCredential ID: ${credential.id}`);
            } catch (error) {
                log('registration-result', `❌ Registration failed:\n${error.name}: ${error.message}`, true);
            }
        }
        
        async function testSupabaseConnection() {
            try {
                const response = await fetch('https://elepidjpvuywldsnaetd.supabase.co/functions/v1/webauthn-register-begin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZXBpZGpwdnV5d2xkc25hZXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzYzNzg1OTIsImV4cCI6MjA1MTk1NDU5Mn0.q7M6TqHtNUhGtn1Qvr4J4JS6s6-9L6huubUgK1v_7JA'
                    },
                    body: JSON.stringify({
                        userId: 'test-user-id'
                    })
                });
                
                const text = await response.text();
                log('supabase-result', 
                    `Status: ${response.status}\nResponse: ${text.substring(0, 500)}${text.length > 500 ? '...' : ''}`,
                    !response.ok
                );
            } catch (error) {
                log('supabase-result', `❌ Connection failed:\n${error.message}`, true);
            }
        }
    </script>
</body>
</html>
