<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FacePay Environment Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-top: 0;
    }
    .status {
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      font-family: monospace;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }
    button:hover {
      background: #0056b3;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔧 FacePay Environment Test</h1>
    <p>This page verifies that your environment variables are configured correctly.</p>
    
    <div id="results"></div>
    
    <button onclick="runTests()">Run Tests</button>
  </div>

  <script type="module">
    window.runTests = async function() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div class="status info">Running tests...</div>';
      
      let html = '';
      let allPassed = true;

      // Test 1: Check if VITE_SUPABASE_URL is set
      const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
      if (supabaseUrl && supabaseUrl.includes('supabase.co')) {
        html += `<div class="status success">✅ VITE_SUPABASE_URL is set: ${supabaseUrl}</div>`;
      } else {
        html += `<div class="status error">❌ VITE_SUPABASE_URL is not set or invalid</div>`;
        allPassed = false;
      }

      // Test 2: Check if VITE_SUPABASE_ANON_KEY is set
      const anonKey = import.meta.env.VITE_SUPABASE_ANON_KEY;
      if (anonKey && anonKey.startsWith('eyJ')) {
        html += `<div class="status success">✅ VITE_SUPABASE_ANON_KEY is set (starts with: ${anonKey.substring(0, 20)}...)</div>`;
      } else {
        html += `<div class="status error">❌ VITE_SUPABASE_ANON_KEY is not set or invalid</div>`;
        allPassed = false;
      }

      // Test 3: Try to initialize Supabase client
      try {
        const { createClient } = await import('@supabase/supabase-js');
        const supabase = createClient(supabaseUrl, anonKey);
        html += `<div class="status success">✅ Supabase client initialized successfully</div>`;
        
        // Test 4: Try to get session (will be null if not logged in, but shouldn't error)
        try {
          const { data, error } = await supabase.auth.getSession();
          if (!error) {
            html += `<div class="status success">✅ Supabase auth connection works (session: ${data.session ? 'logged in' : 'not logged in'})</div>`;
          } else {
            html += `<div class="status error">❌ Supabase auth error: ${error.message}</div>`;
            allPassed = false;
          }
        } catch (err) {
          html += `<div class="status error">❌ Supabase auth test failed: ${err.message}</div>`;
          allPassed = false;
        }
      } catch (err) {
        html += `<div class="status error">❌ Failed to initialize Supabase: ${err.message}</div>`;
        allPassed = false;
      }

      // Test 5: Check Edge Function URLs
      if (supabaseUrl) {
        const enrollUrl = `${supabaseUrl}/functions/v1/enroll-face`;
        const identifyUrl = `${supabaseUrl}/functions/v1/identify-face`;
        const verifyUrl = `${supabaseUrl}/functions/v1/verify-face`;
        
        html += `<div class="status info">
          📍 Edge Function URLs:<br>
          • Enroll: ${enrollUrl}<br>
          • Identify: ${identifyUrl}<br>
          • Verify: ${verifyUrl}
        </div>`;
      }

      // Summary
      if (allPassed) {
        html += `<div class="status success"><strong>🎉 All tests passed! Your environment is configured correctly.</strong></div>`;
        html += `<div class="status info">
          ✅ Next steps:<br>
          1. Complete database setup (see SETUP_CHECKLIST.md)<br>
          2. Create biometric-images storage bucket<br>
          3. Test customer registration with biometric enrollment
        </div>`;
      } else {
        html += `<div class="status error"><strong>⚠️ Some tests failed. Please check your .env.local file.</strong></div>`;
        html += `<div class="status info">
          Make sure .env.local contains:<br>
          • VITE_SUPABASE_URL=https://your-project.supabase.co<br>
          • VITE_SUPABASE_ANON_KEY=eyJhbGc...<br>
          <br>
          Then restart the dev server: npm run dev
        </div>`;
      }

      resultsDiv.innerHTML = html;
    };

    // Auto-run tests on load
    window.addEventListener('load', () => {
      setTimeout(runTests, 500);
    });
  </script>
</body>
</html>
